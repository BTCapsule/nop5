<!DOCTYPE html>
<html>
  <meta name="viewport" content="width=1000, maximum-scale=1, user-scalable=no">
  <meta name="application-name" content="LayerTwoLabs">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="https://btcapsule.com/images/qrCode.png">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="https://btcapsule.com/images/qrCode.png" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mainchain">
  <meta name="mobile-web-app-capable" content="yes">
  <head>
    <script src="https://unpkg.com/html5-qrcode"></script>
  </head>

  <style>
    /* =============================================
       DESIGN TOKENS
    ============================================= */
    :root {
      --color-bg:           #000000;
      --color-fg:           #ffffff;
      --color-muted:        #888888;
      --color-dim:          #333333;
      --color-panel-bg:     #111111;
      --color-accent-green: #4ec9b0;
      --color-accent-red:   #ff6b6b;
      --color-accent-blue:  #9cdcfe;
      --color-border:       #ffffff;

      --font-ui:    sans-serif;
      --font-mono:  Consolas, monospace;

      --fs-title:          60px;
      --fs-balance:        100px;
      --fs-body:           34px;
      --fs-input:          32px;
      --fs-amount:         80px;
      --fs-btc:            60px;
      --fs-btn:            24px;
      --fs-confirm:        50px;
      --fs-sidechain-item: 48px;

      --btn-padding: 20px 25px;
      --btn-margin:  10px;
    }

    /* =============================================
       RESET / BASE
    ============================================= */
    body {
      color: var(--color-fg);
      background: var(--color-bg);
      margin: 0;
      padding: 0;
    }

    li { list-style: none; }

    /* =============================================
       TABLES
    ============================================= */
    th, td { padding: 15px; text-align: left; }
    table, th, td { border: 1px solid var(--color-border); }
    th { background-color: var(--color-bg); color: var(--color-fg); }
    tr:hover { background-color: #D6EEEE; }
    tr:nth-child(even) { background-color: var(--color-bg); color: var(--color-fg); }
    .center-table { margin-left: auto; margin-right: auto; }

    /* =============================================
       BUTTONS (general)
    ============================================= */
    button {
      background-color: var(--color-fg);
      color: var(--color-bg);
      padding: var(--btn-padding);
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: var(--fs-btn);
      margin: var(--btn-margin);
      cursor: pointer;
      border: none;
    }

    /* =============================================
       HEADER BAR
    ============================================= */
    #header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px 0 40px;
    }

    #page-title {
      color: var(--color-fg);
      font-size: var(--fs-title);
      font-family: var(--font-ui);
      margin: 0;
    }

    /* The "···" trigger button */
    #menu-trigger {
      font-size: 52px;
      font-family: var(--font-ui);
      color: var(--color-fg);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 12px;
      margin: 0;
      line-height: 1;
      letter-spacing: 6px;
    }

    /* =============================================
       SIDE MENU OVERLAY
    ============================================= */
    #menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
    }

    #menu-overlay.open { display: block; }

    /* Dim backdrop */
    #menu-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    /* Drawer slides in from right */
    #menu-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 360px;
      height: 100%;
      background: #111111;
      border-left: 1px solid var(--color-dim);
      display: flex;
      flex-direction: column;
      padding: 50px 0;
      box-sizing: border-box;
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }

    #menu-overlay.open #menu-drawer {
      transform: translateX(0);
    }

    .menu-item {
      font-family: var(--font-ui);
      font-size: 42px;
      color: var(--color-fg);
      padding: 28px 48px;
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      margin: 0;
      transition: background 0.15s;
      display: block;
    }

    .menu-item:hover { background: var(--color-dim); }

    /* =============================================
       LAYOUT: CHROME
    ============================================= */
    #balance {
      color: var(--color-fg);
      font-size: var(--fs-balance);
      font-family: var(--font-ui);
      text-align: center;
      margin-top: 30px;
    }

    /* Bottom RECEIVE / SEND — fixed, 170px from bottom */
    #button-container2 {
      position: fixed;
      bottom: 170px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      z-index: 100;
    }

    #receiveButton,
    #sendButton {
      font-size: 42px;
      padding: 30px 60px;
      border-radius: 16px;
      margin: 0;
      width: auto;
    }

    /* =============================================
       LAYOUT: MIDDLE PANEL
    ============================================= */
    #panel {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 400px;
      padding-bottom: 300px;
      margin-top: 15px;
    }

    /* =============================================
       VIEW: INFO / TRANSACTIONS
    ============================================= */
    #view-info {
      display: none;
      font-family: var(--font-mono);
      font-size: var(--fs-body);
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      max-height: 60vh;
      overflow-y: auto;
      width: 100%;
      max-width: 900px;
    }

    .tx-list  { list-style: none; padding: 0; margin: 0; }
    .tx-item  { padding: 12px 0; border-bottom: 1px solid var(--color-dim); }
    .tx-row   { display: flex; align-items: center; gap: 300px; }
    .tx-id    { color: var(--color-accent-blue); font-weight: bold; }
    .tx-amount-out     { color: var(--color-accent-red);   font-weight: bold; }
    .tx-amount-in      { color: var(--color-accent-green); font-weight: bold; }
    .tx-amount-unknown { color: var(--color-muted); }
    .tx-time  { color: var(--color-muted); font-size: 0.85em; margin-top: 4px; }
    .tx-empty { color: var(--color-accent-red); }

    /* =============================================
       VIEW: RECEIVE / QR CODE
    ============================================= */
    #view-receive {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    #qrcode-wrapper {
      border: 10px solid var(--color-border);
      padding: 10px;
      background-color: var(--color-fg);
      width: 512px;
      height: 512px;
    }

    #qrcode { text-align: center; }

    #address {
      color: var(--color-fg);
      font-size: var(--fs-input);
      font-family: var(--font-ui);
      text-align: center;
      word-wrap: break-word;
      max-width: 600px;
    }

    /* =============================================
       VIEW: SEND FORM
    ============================================= */
    #view-send {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .amount-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #amount {
      background-color: var(--color-bg);
      color: var(--color-fg);
      font-size: var(--fs-amount);
      width: 200px;
      text-align: center;
      border: none;
      outline: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    #btc-label {
      font-size: var(--fs-btc);
      font-family: var(--font-mono);
      color: var(--color-fg);
    }

    #btcAddress {
      background-color: var(--color-bg);
      color: var(--color-fg);
      font-size: var(--fs-input);
      width: 800px;
      border: none;
      outline: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
      border-bottom: 1px solid var(--color-fg);
      margin-top: 30px;
    }

    #feerate {
      color: var(--color-fg);
      font-size: var(--fs-input);
      font-family: var(--font-ui);
      text-align: center;
      word-wrap: break-word;
      margin-top: 10px;
    }

    #confirm {
      display: block;
      margin: 40px auto 0;
      font-size: var(--fs-confirm);
      color: var(--color-bg);
    }

    #reader { width: 700px; height: 500px; }

    /* =============================================
       VIEW: SIDECHAINS
    ============================================= */
    #view-sidechains {
      display: none;
      flex-direction: column;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 50px;
      text-align: center;
    }

    .sidechain-list {
      list-style: none;
      padding: 0;
      margin: 20px auto;
      max-width: 600px;
      text-align: center;
    }

    .sidechain-item {
      font-size: var(--fs-sidechain-item);
      padding: 20px;
      margin: 10px auto;
      cursor: pointer;
      background: var(--color-panel-bg);
      font-family: var(--font-mono);
      color: var(--color-fg);
      border-radius: 12px;
      transition: background 0.2s ease-in-out, transform 0.2s ease-in-out;
    }

    .sidechain-item:hover {
      background: var(--color-dim);
      transform: scale(1.05);
    }

    .sidechain-checking {
      color: var(--color-muted);
      font-family: var(--font-mono);
      font-size: 40px;
    }

    /* =============================================
       VIEW: CREATE WALLET
    ============================================= */
    #view-create-wallet {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #walletName {
      background-color: var(--color-bg);
      color: var(--color-fg);
      font-size: var(--fs-input);
      width: 800px;
      border: none;
      outline: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
      border-bottom: 1px solid var(--color-fg);
    }

    .sidechain-input {
      background-color: var(--color-bg);
      color: var(--color-fg);
      font-size: var(--fs-input);
      width: 800px;
      border: none;
      outline: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
      border-bottom: 1px solid var(--color-fg);
      margin-top: 20px;
      display: block;
    }

    /* =============================================
       VIEW: MNEMONIC
    ============================================= */
    #view-mnemonic {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
    }

    .word {
      font-family: var(--font-ui);
      font-size: 48px;
      color: var(--color-bg);
      background-color: var(--color-fg);
      margin: 10px;
      padding: 10px;
    }

    /* =============================================
       VIEW: RESULT
    ============================================= */
    #view-result {
      display: none;
      font-family: var(--font-mono);
      font-size: var(--fs-body);
      color: #d4d4d4;
      padding: 15px;
      border-radius: 8px;
      max-height: 60vh;
      overflow-y: auto;
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    /* =============================================
       JSON VIEWER
    ============================================= */
    .json-viewer pre { white-space: pre-wrap; word-wrap: break-word; }
    .json-key     { color: var(--color-accent-blue); font-weight: bold; }
    .json-string  { color: #ce9178; }
    .json-number  { color: #b5cea8; }
    .json-boolean { color: #569cd6; }
    .json-null    { color: #569cd6; font-style: italic; }
    .json-keyword { color: #569cd6; }

    details summary { list-style: none; }
    details summary::-webkit-details-marker { display: none; }
    details summary::before       { content: "▶ "; color: var(--color-accent-green); }
    details[open] summary::before { content: "▼ "; }

    /* =============================================
       UTILITY
    ============================================= */
    .hidden { display: none !important; }
    #html5-qrcode-button-camera-stop { display: none; }

    #popup { position: absolute; width: 400px; height: 900px; background-color: var(--color-fg); }
    #dawg  { background-color: var(--color-bg); height: 500px; }

    .sidechain-button {
      background-color: var(--color-fg);
      color: var(--color-bg);
      padding: var(--btn-padding);
      text-align: center;
      display: block;
      font-size: var(--fs-btn);
      margin: 20px auto;
    }

  </style>

  <body>

    <!-- ── HEADER BAR ─────────────────────────── -->
    <div id="header-bar" class="exclude">
      <h2 id="page-title" class="exclude">Mainchain</h2>
      <button id="menu-trigger" class="exclude">···</button>
    </div>

    <!-- ── SIDE MENU OVERLAY ─────────────────── -->
    <div id="menu-overlay">
      <div id="menu-backdrop"></div>
      <div id="menu-drawer">
        <button class="menu-item exclude" onclick="menuAction(() => rpc('wallet', 'GetBalance'))">balance</button>
        <button class="menu-item exclude" onclick="menuAction(() => { showView('info'); rpc('wallet', 'ListTransactions'); })">info</button>
        <button class="menu-item exclude" onclick="menuAction(() => rpc('wallet', 'CreateNewAddress'))">address</button>
        <button class="menu-item exclude" onclick="menuAction(() => rpc('validator', 'GetSidechains'))">sidechains</button>
      </div>
    </div>

    <!-- ── BALANCE ────────────────────────────── -->
    <div id="balance"></div>
    <br><br>

    <!-- ══════════════════════════════════════════
         MIDDLE PANEL
    ═══════════════════════════════════════════ -->
    <div id="panel">

      <div id="view-info"></div>

      <div id="view-receive">
        <div id="qrcode-wrapper"><div id="qrcode"></div></div>
        <div id="address"></div>
      </div>

      <div id="view-send">
        <div id="reader" class="hidden"></div>
        <div id="btcForm">
          <div class="amount-row">
            <input type="number" id="amount" name="amount" min="0" value="0" maxlength="15">
            <span id="btc-label">BTC</span>
          </div>
          <br><br>
          <button id="scanButton" class="exclude" type="button">SCAN</button>
          <br>
          <input type="text" id="btcAddress" name="btcAddress" placeholder="Enter Address">
          <br><br>
          <p id="feerate"></p>
          <button id="confirm">CONFIRM</button>
        </div>
      </div>

      <div id="view-sidechains"></div>

      <div id="view-create-wallet">
        <input type="text" id="walletName" placeholder="Enter wallet name">
        <br><br>
        <button id="confirmWalletCreation">NEXT</button>
      </div>

      <div id="view-mnemonic"></div>
      <div id="view-result"></div>

    </div><!-- /#panel -->

    <!-- ── BOTTOM FIXED NAV ───────────────────── -->
    <div id="button-container2" class="exclude">
      <button id="receiveButton" class="exclude">RECEIVE</button>
      <button id="sendButton"    class="exclude">SEND</button>
    </div>

  </body>

  <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
  <script>

    let timer = null;
    let confirmedBalance = 0;
    let unconfirmedBalance = 0;

    // ── MENU ─────────────────────────────────────────────────────────────────
    const menuOverlay = document.getElementById('menu-overlay');

    document.getElementById('menu-trigger').addEventListener('click', () => {
      menuOverlay.classList.add('open');
    });

    document.getElementById('menu-backdrop').addEventListener('click', () => {
      menuOverlay.classList.remove('open');
    });

    function menuAction(fn) {
      menuOverlay.classList.remove('open');
      fn();
    }

    // ── VIEW MANAGER ─────────────────────────────────────────────────────────
    const ALL_VIEWS = [
      'view-info', 'view-receive', 'view-send', 'view-sidechains',
      'view-create-wallet', 'view-mnemonic', 'view-result',
    ];

    function showView(name) {
      ALL_VIEWS.forEach(id => { document.getElementById(id).style.display = 'none'; });
      const el = document.getElementById('view-' + name);
      if (el) {
        const flexViews = ['receive', 'send', 'sidechains', 'create-wallet', 'mnemonic'];
        el.style.display = flexViews.includes(name) ? 'flex' : 'block';
      }
    }

    // ── RPC ──────────────────────────────────────────────────────────────────
    async function rpc(category, method, args = []) {
      try {
        const body = args.length ? { args } : undefined;
        const res = await fetch(`/${category}/${method}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined
        });
        const data = await res.json();
        console.log(category, method, data);

        if (method === 'GetBalance') {
          const sats = data.result?.confirmedSats ? parseInt(data.result.confirmedSats, 10) : 0;
          confirmedBalance = sats / 1e8;
        }
        document.getElementById('balance').innerHTML = `${confirmedBalance} BTC`;

        if (method === 'GetChainInfo')     showInfo(data.result);
        if (method === 'GetSidechains')    showSidechainsView(data.result);
        if (method === 'ListTransactions') showInfo(data.result);
        if (method === 'CreateNewAddress') {
          showAddressQRCode(data.result.address);
          console.log(data.result.address);
        }
        return data;
      } catch (err) {
        console.error(`RPC Error: ${category}/${method}`, err);
        return { error: err.toString() };
      }
    }

    // ── SHOW INFO ─────────────────────────────────────────────────────────────
    function showInfo(info) {
      showView('info');
      const container = document.getElementById('view-info');
      container.innerHTML = '';

      if (!info?.transactions || !Array.isArray(info.transactions) || info.transactions.length === 0) {
        container.innerHTML = '<p class="tx-empty">No transactions found.</p>';
        return;
      }

      const sortedTxs = [...info.transactions].sort((a, b) =>
        (b.confirmationInfo?.height || 0) - (a.confirmationInfo?.height || 0)
      );
      const ul = document.createElement('ul');
      ul.className = 'tx-list';

      sortedTxs.slice(0, 5).forEach(tx => {
        const li = document.createElement('li');
        li.className = 'tx-item';
        const shortTxid = tx.txid?.hex?.substring(0, 6) || '??????';
        let amountHTML = '';
        if (tx.sentSats) {
          amountHTML = `<span class="tx-amount-out">-${(parseInt(tx.sentSats, 10) / 1e8).toFixed(8)} BTC</span>`;
        } else if (tx.receivedSats) {
          amountHTML = `<span class="tx-amount-in">+${(parseInt(tx.receivedSats, 10) / 1e8).toFixed(8)} BTC</span>`;
        } else {
          amountHTML = `<span class="tx-amount-unknown">?</span>`;
        }
        const time = tx.confirmationInfo?.timestamp || 'unconfirmed';
        li.innerHTML = `
          <div class="tx-row">
            <div><span class="tx-id">${shortTxid}...</span></div>
            <div style="text-align:right;">${amountHTML}</div>
          </div>
          <div class="tx-time">${time}</div>
        `;
        ul.appendChild(li);
      });
      container.appendChild(ul);
    }

    // ── SHOW ADDRESS + QR ─────────────────────────────────────────────────────
    function showAddressQRCode(address) {
      showView('receive');
      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      document.getElementById('address').textContent = address;
      new QRCode(qrEl, {
        text: `bitcoin:${address}`,
        width: 512, height: 512,
        colorDark: '#000000', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    // ── SHOW SIDECHAINS ───────────────────────────────────────────────────────
    async function showSidechainsView() {
      showView('sidechains');
      const container = document.getElementById('view-sidechains');
      container.innerHTML = `<h3>CHOOSE A SIDECHAIN:</h3><p class="sidechain-checking">Checking available sidechains...</p>`;
      const current = getCurrentSidechain();
      const running = await detectRunningSidechainsViaProxy();
      let html = '<h3>CHOOSE A SIDECHAIN:</h3><ul class="sidechain-list">';
      html += `<li class="sidechain-item" onclick="window.location.href='index.html'">Mainchain</li>`;
      running.forEach(name => {
        const lower = name.toLowerCase();
        if (lower !== current)
          html += `<li class="sidechain-item" onclick="window.location.href='${lower}.html'">${name}</li>`;
      });
      html += '</ul>';
      container.innerHTML = html;
    }

    // ── SEND BUTTON ───────────────────────────────────────────────────────────
    document.getElementById('sendButton').addEventListener('click', () => {
      showView('send');
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('btcAddress').value = '';
      document.getElementById('amount').value = '0';
      document.getElementById('btcForm').style.display = 'block';
      ['btcAddress', 'amount', 'scanButton', 'btc-label', 'confirm'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.visibility = 'visible';
      });
    });

    // ── RECEIVE BUTTON ────────────────────────────────────────────────────────
    document.getElementById('receiveButton').addEventListener('click', () => {
      rpc('wallet', 'CreateNewAddress');
    });

    // ── CONFIRM SEND ──────────────────────────────────────────────────────────
    document.getElementById('confirm').addEventListener('click', async (e) => {
      e.preventDefault();
      const address   = document.getElementById('btcAddress').value.trim();
      const amountBtc = parseFloat(document.getElementById('amount').value);
      if (!isValidBitcoinAddress(address)) { alert('Invalid Bitcoin, Testnet, or Signet address'); return; }
      if (isNaN(amountBtc) || amountBtc <= 0) { alert('Enter a valid amount'); return; }
      const amountSats = Math.floor(amountBtc * 1e8);
      const txRequest  = { destinations: { [address]: amountSats }, feeRate: { sat_per_vbyte: 10 } };
      showView('result');
      const resultDiv = document.getElementById('view-result');
      resultDiv.innerHTML = `<p>Sending ${amountBtc} BTC to ${address}...</p><pre>'${JSON.stringify(txRequest, null, 2)}'</pre>`;
      try {
        const res  = await fetch('/wallet/SendTransaction', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(txRequest)
        });
        const data = await res.json();
        if (data.error) {
          resultDiv.innerHTML += `<p style="color:var(--color-accent-red);">Transaction failed: ${data.error}</p>`;
        } else {
          resultDiv.innerHTML += `<p style="color:var(--color-accent-green);">Transaction sent! TXID: ${data.result.txid.hex}</p>`;
          rpc('wallet', 'GetBalance');
          rpc('wallet', 'ListTransactions');
        }
      } catch (err) {
        resultDiv.innerHTML += `<p style="color:var(--color-accent-red);">Error: ${err.message}</p>`;
      }
    });

    // ── QR SCANNER ────────────────────────────────────────────────────────────
    let scanner = null;

    document.getElementById('scanButton').addEventListener('click', async () => {
      const reader = document.getElementById('reader');
      ['btcAddress', 'amount', 'scanButton', 'btc-label', 'confirm'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.visibility = 'hidden';
      });
      reader.classList.remove('hidden');
      reader.style.visibility = 'visible';
      if (!scanner) scanner = new Html5Qrcode('reader');
      try {
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 2000, height: 1000 } },
          (decodedText) => {
            handleScannedText(decodedText);
            scanner.stop();
            reader.classList.add('hidden');
          },
          () => {}
        );
      } catch (err) { console.error('Camera start failed:', err); }
    });

    function handleScannedText(text) {
      let clean   = text.replace(/^[a-zA-Z]+:/, '');
      let parts   = clean.split('?');
      let address = parts[0];
      let amount  = parts[1] ? new URLSearchParams(parts[1]).get('amount') : null;
      if (isValidBitcoinAddress(address)) {
        document.getElementById('btcAddress').value = address;
        if (amount) document.getElementById('amount').value = amount;
        ['btcAddress', 'amount', 'scanButton', 'btc-label', 'confirm'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.visibility = 'visible';
        });
      } else {
        alert('Invalid Bitcoin, Testnet, or Signet address');
      }
    }

    // ── HELPERS ───────────────────────────────────────────────────────────────
    function isValidBitcoinAddress(address) {
      return /^(bc1|tb1|sb1|[13])[a-zA-HJ-NP-Z0-9]{20,100}$/.test(address);
    }

    function btcToSats(btc) { return Math.floor(btc * 1e8); }

    function getCurrentSidechain() {
      return window.location.pathname.split('/').pop().replace('.html', '').toLowerCase();
    }

    async function detectRunningSidechainsViaProxy() {
      const sidechains = [
        { name: 'BitNames',     proxy: 'bitnames' },
        { name: 'BitAssets',    proxy: 'bitassets' },
        { name: 'Thunder',      proxy: 'thunder' },
        { name: 'Truthcoin-DC', proxy: 'truthcoin-dc' },
        { name: 'ZSide',        proxy: 'zside' },
        { name: 'Photon',       proxy: 'photon' },
        { name: 'Coinshift',    proxy: 'coinshift' }
      ];
      const running = [];
      for (const sc of sidechains) {
        try {
          const res = await fetch(`/${sc.proxy}/ping`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'ping' })
          });
          if (res.status !== 404 && res.status !== 502) running.push(sc.name);
        } catch (err) { console.log(`${sc.name} backend not reachable`, err.message); }
      }
      return running;
    }

    // ── TIMERS ────────────────────────────────────────────────────────────────
    function startTimers() {
      rpc('wallet', 'GetBalance');
      rpc('wallet', 'ListTransactions');
      if (timer) clearInterval(timer);
      timer = setInterval(() => rpc('wallet', 'GetBalance'), 5000);
    }

    document.addEventListener('DOMContentLoaded', () => { startTimers(); });

  </script>
</html>
