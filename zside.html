<script>
let timer = null;

let confirmedBalance = 0;
let pendingSpend = 0;
let unconfirmedBalance = null;

// restore pending state if it exists
const savedPending = localStorage.getItem("pendingSpend");
const savedUnconfirmed = localStorage.getItem("unconfirmedBalance");

if (savedPending) pendingSpend = parseInt(savedPending);
if (savedUnconfirmed) unconfirmedBalance = parseInt(savedUnconfirmed);

// --------- Utility Functions ---------
function showDivs(divIds) {
    let divs = document.getElementsByTagName('div');

    for (let div of divs) {
        if (!div.classList.contains('exclude')) {
            div.style.visibility = 'hidden';
            div.style.height = "0px";
        }
    }

    for (let id of divIds) {
        let elem = document.getElementById(id);
        if (elem) {
            elem.style.visibility = 'visible';
            elem.style.height = "auto";   // ← restore height
        }
    }
}









async function runRPC(category, method, args = []) {
    const data = await callRPC(category, method, args);
    console.log(category, method, data);
    if (method === 'GetSidechains') { showSidechains(data.result); console.log(data.result); }
     if (method === 'GetChainInfo') { showInfo(data.result); console.log(data.result); }
}

function showInfo(info) {
    // Get the result div and clear it
    let resultDiv = document.getElementById("result");
    resultDiv.innerHTML = '';

    // Hide other UI elements
    hide([
        'mnemonicContainer', 'create_wallet', 'walletName', 'confirmWalletCreation',
        'btcAddress', 'feerate', 'scanButton', 'btc', 'amount', 'confirm',
        'qrcode-wrapper', 'qrcode', 'address'
    ]);

    // Create container div with same styles
    const container = document.createElement('div');
    container.style.padding = '15px';
    container.style.borderRadius = '8px';
    container.style.marginTop = '15px';
    container.style.fontFamily = 'Consolas, monospace';
    container.style.fontSize = '34px';
    container.style.color = '#d4d4d4';
    container.style.maxHeight = '60vh';
    container.style.overflowY = 'auto';

    // Check if we have transactions
    if (!info || !Array.isArray(info) || info.length === 0) {
        container.innerHTML = '<p style="color:#ff6b6b;">No transactions found.</p>';
        resultDiv.appendChild(container);
        resultDiv.style.visibility = 'visible';
        resultDiv.style.marginTop = '-1250px';
        return;
    }

    // Optional: sort by txid (or add custom sorting if needed)
    const recentTxs = info.slice(0, 5); // take only the first 5 items

    // Build list
    const ul = document.createElement('ul');
    ul.style.listStyle = 'none';
    ul.style.padding = '0';
    ul.style.margin = '0';

    recentTxs.forEach(tx => {
        const li = document.createElement('li');
        li.style.padding = '12px 0';
        li.style.borderBottom = '1px solid #333';

        // Get short txid
        const txid = tx?.outpoint?.Regular?.txid || '??????';
        const shortTxid = txid.substring(0, 6);

        // Get value in sats and convert to BTC
        const sats = tx?.output?.content?.Value || 0;
        const btc = (sats / 1e8).toFixed(8);

        // Amount display (incoming, always green here)
        const amountDisplay = `<span style="color:#4ec9b0; font-weight:bold;">+${btc} BTC</span>`;

        // Build row exactly like old layout
        li.innerHTML = `
            <div style="display:flex; align-items:center; gap:300px;">
                <div>
                    <span style="color:#9cdcfe; font-weight:bold;">${shortTxid}...</span>
                </div>
                <div style="text-align:right;">
                    ${amountDisplay}
                </div>
            </div>
        `;

        ul.appendChild(li);
    });

    container.appendChild(ul);

    resultDiv.appendChild(container);

    resultDiv.style.visibility = 'visible';
    resultDiv.style.marginTop = '-1250px';
    resultDiv.style.fontSize = '16px';
}





async function showDeposit() {

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = '';

    // Hide everything unrelated
    hide([
        'mnemonicContainer','create_wallet','walletName','confirmWalletCreation',
        'btcAddress','feerate','scanButton','confirm',
        'qrcode-wrapper','qrcode','address', 'amount', 'btc'
    ]);

    autoShowQRCode = false;

    try {

        // -------- GET RAW ADDRESS --------
        const newAddrData = await zsideRPC('get_new_transparent_address');
        const rawAddress = newAddrData?.result;

        if (!rawAddress || typeof rawAddress !== 'string') {
            resultDiv.innerHTML = `<p style="color:#ff6b6b; font-size:18px;">Failed to get deposit address</p>`;
            resultDiv.style.visibility = 'visible';
            return;
        }

        // -------- FORMAT ADDRESS FOR DISPLAY --------
        const formattedData = await zsideRPC('format_deposit_address', [rawAddress]);
        const displayAddress = formattedData?.result || rawAddress;

        // -------- SHOW ADDRESS UI --------
        resultDiv.innerHTML = `
        <div style="
            padding:20px 25px;
            border-radius:12px;
            max-width:700px;
            margin:30px auto;
            text-align:center;
            font-family:'Consolas', monospace;
            color:#d4d4d4;
            box-shadow:0 0 10px #4ec9b0;
        ">
            <h3 style="color:#4ec9b0; margin-bottom:15px; font-size:34px;">Deposit Address</h3>

            <p id="depositAddress" style="
                font-size:28px;
                word-break:break-all;
                background:#252526;
                padding:15px;
                border-radius:8px;
                display:inline-block;
                color:#9cdcfe;
                cursor:pointer;
                user-select:all;
            ">${displayAddress}</p>

            <div id="copyFeedback" style="color:#4ec9b0; margin-top:10px; font-size:16px; display:none;">
                Copied!
            </div>

            <div style="margin-top:40px;">
                <input type="number" id="depositAmount" placeholder="0.00"
                style="
                    background:black;
                    color:white;
                    font-size:60px;
                    width:220px;
                    border:none;
                    border-bottom:1px solid white;
                    text-align:center;
                ">
                <span style="font-size:50px; font-family:monospace;"> BTC</span>
            </div>

            <button id="depositButton"
            style="
                display:block;
                margin:40px auto 0 auto;
                font-size:42px;
                padding:18px 40px;
            ">
            DEPOSIT
            </button>

        </div>
        `;

        // -------- COPY ADDRESS --------
        const addressEl = document.getElementById("depositAddress");
        const feedbackEl = document.getElementById("copyFeedback");

        addressEl.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(displayAddress);
                feedbackEl.style.display = "block";
                setTimeout(() => feedbackEl.style.display = "none", 1500);
            } catch(err) {
                console.error(err);
            }
        });

        // -------- DEPOSIT BUTTON --------
        document.getElementById("depositButton").addEventListener("click", async function () {

            const amountBtc = parseFloat(document.getElementById("depositAmount").value);

            if (isNaN(amountBtc) || amountBtc <= 0) {
                alert("Enter a valid amount");
                return;
            }

            const valueSats = btcToSats(amountBtc);
            const feeSats = 2000;

            resultDiv.innerHTML += `<p style="margin-top:20px;">Creating deposit...</p>`;

            // Prevent double-click deposits
            this.disabled = true;

            try {

                const response = await zsideRPC("create_deposit", [
                    rawAddress,   // IMPORTANT: raw address here
                    valueSats,
                    feeSats
                ]);

                if (response?.error) {
                    resultDiv.innerHTML += `<p style="color:red;">Deposit failed</p>`;
                    this.disabled = false;
                    return;
                }

                resultDiv.innerHTML += `
                <p style="color:#4ec9b0; font-size:20px;">
                Deposit transaction created
                </p>`;

                zsideRPC("balance");
                zsideRPC("get_wallet_utxos");

            } catch(err) {

                console.error(err);

                resultDiv.innerHTML += `<p style="color:red;">Error creating deposit</p>`;

                this.disabled = false;
            }

        });

        resultDiv.style.visibility = 'visible';
        resultDiv.style.marginTop = '-1250px';

    } catch(err) {

        console.error("showDeposit error:", err);

        resultDiv.innerHTML = `<p style="color:#ff6b6b; font-size:18px;">Error fetching deposit address</p>`;
        resultDiv.style.visibility = 'visible';

    } finally {

        autoShowQRCode = true;

    }

}






function hide(elementIds) {
    for (let id of elementIds) {
        let elem = document.getElementById(id);
        if (elem) elem.style.visibility = 'hidden';
    }
}

// Validate Bitcoin, Testnet, or Signet addresses
function isValidzsideAddress(address) {
    // Matches: bc1/tb1/sb1 (segwit) or 1/3 legacy addresses
    return /^[1-9A-HJ-NP-Za-km-z]{25,32}$/.test(address);
}



let scanner = null;

document.getElementById("scanButton").addEventListener("click", async () => {

            }

       // showDivs(['btcAddress', 'amount', 'scanButton', 'btc', 'confirm']);
    }

});


function handleScannedText(text) {
    // Remove bitcoin: / lightning: / etc prefixes
    let clean = text.replace(/^[a-zA-Z]+:/, "").trim();

    // Split off query params (bitcoin:addr?amount=0.1&label=...)
    let parts = clean.split("?");
    let address = parts[0].trim();

    let amount = null;
    if (parts[1]) {
        const params = new URLSearchParams(parts[1]);
        amount = params.get("amount");  // in BTC
    }

    // Validate with new function
    if (isValidzsideAddress(address)) {   // ← or isValidAddress if dual support
        document.getElementById("btcAddress").value = address;
        if (amount) {
            document.getElementById("amount").value = amount;
        }
        // Optional: auto-focus amount or confirm
    } else {
        alert("Invalid address (expected 25–32 character mainchain address)");
    }
}

    return Math.floor(btc * 1e8); // converts BTC to satoshis
}

async function callRPC(category, method, args = []) {
    try {
        const body = args.length ? { args } : undefined;
        const res = await fetch(`/${category}/${method}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        });
        return await res.json();
    } catch (err) {
        console.error(`RPC Error: ${category}/${method}`, err);
        return { error: err.toString() };
    }
}

async function detectRunningSidechainsViaProxy() {
    const sidechains = [
        { name: "BitNames", proxy: "bitnames" },
        { name: "BitAssets", proxy: "bitassets" },
        { name: "Thunder", proxy: "thunder" },
        { name: "Truthcoin-DC", proxy: "truthcoin-dc" },
        { name: "zSide", proxy: "zside" },
        { name: "Photon", proxy: "photon" },
        { name: "Coinshift", proxy: "coinshift" }
    ];

    const running = [];

    for (const sc of sidechains) {
        try {
            const res = await fetch(`/${sc.proxy}/ping`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "ping" })
            });

            // Only skip if 404
            if (res.status !== 404 && res.status !== 502) {
                running.push(sc.name);
            } else {
                console.log(`${sc.name} backend returned 404, skipping`);
            }

        } catch (err) {
            console.log(`${sc.name} backend not reachable`, err.message);
        }
    }

    return running; // array of names that are actually reachable
}
